<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>팀 진행현황</title>
  <style>
    /* 기본 폰트 및 레이아웃 */
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    /* 헤더: 날짜 드롭다운과 "팀 진행현황" 텍스트 (같은 글자 크기) */
    #headerArea {
      margin: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #dateSelectorContainer select { font-size: 1em; }
    h2 { font-size: 1em; margin: 0; }
    /* 버튼 영역 */
    .button-area { text-align: left; margin: 20px; }
    button { padding: 6px 12px; cursor: pointer; margin: 0 5px; }
    /* 테이블 스타일 – 기존 열별 크기 유지 */
    table {
      border-collapse: collapse;
      margin: 10px auto;
      width: 98%;
      text-align: center;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 4px;
      vertical-align: middle;
      position: relative;
    }
    th { background: #f8f8f8; }
    td.editable { cursor: text; }
    td.editable:focus { outline: 2px solid #007bff; }
    .status-image {
      display: block; margin: 0 auto;
      height: 1.2em; width: auto; object-fit: contain;
      cursor: pointer;
    }
    colgroup col:nth-child(1) { width: 150px; }
    colgroup col:nth-child(2) { width: 250px; }
    colgroup col:nth-child(3) { width: 200px; }
    colgroup col:nth-child(4) { width: 280px; }
    colgroup col:nth-child(5) { width: 280px; }
    colgroup col:nth-child(6) { width: 140px; }
    colgroup col:nth-child(7) { width: 140px; }
    colgroup col:nth-child(8) { width: 400px; }
    colgroup col:nth-child(9) { width: 200px; }
    colgroup col:nth-child(10) { width: 300px; }
    colgroup col:nth-child(11) { width: 440px; }
    colgroup col:nth-child(12) { width: 140px; }
    colgroup col:nth-child(13) { width: 280px; }
    /* 수평선 */
    hr { border: none; border-top: 2px solid #ccc; margin: 20px 0; }
    /* 데이터 표시 영역 */
    #currentDataContainer, #pastDataContainer { margin: 20px; }
    .data-section-header { font-weight: bold; margin: 10px 0; }
  </style>
</head>
<body>
  <!-- 헤더 영역 -->
  <div id="headerArea">
    <!-- 날짜 드롭다운 (왼쪽) -->
    <div id="dateSelectorContainer"></div>
    <h2>팀 진행현황</h2>
  </div>
  <!-- 버튼 영역 -->
  <div class="button-area">
    <button id="submitBtn">Submit</button>
    <button id="addRowBtn">행 추가</button>
  </div>
  <!-- 현재 데이터 편집영역 -->
  <div id="currentDataContainer">
    <div id="currentHeader" class="data-section-header"></div>
    <div id="currentTableContainer">
      <table class="myTable">
        <colgroup>
          <col><col><col><col><col><col><col><col><col><col><col><col><col>
        </colgroup>
        <thead>
          <tr>
            <th>담당 전략과제</th>
            <th>세부 과제</th>
            <th>프로젝트/업무명</th>
            <th>개요</th>
            <th>주요 로드맵</th>
            <th>진척률</th>
            <th>원활도</th>
            <th>현 주요 사항</th>
            <th>추진 결과 / 산출물</th>
            <th>담당자 (업무)</th>
            <th>Issue / 대응 방안</th>
            <th>컨플루언스 (히스토리)</th>
            <th>(상무님 코멘터리)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td class="editable" contenteditable="true"></td>
            <td class="editable" contenteditable="true"></td>
            <td class="editable" contenteditable="true"></td>
            <td class="editable" contenteditable="true"></td>
            <td></td>
            <td class="editable" contenteditable="true"></td>
            <td class="editable" contenteditable="true"></td>
            <td class="editable" contenteditable="true"></td>
            <td class="editable" contenteditable="true"></td>
            <td class="editable" contenteditable="true"></td>
            <td class="editable" contenteditable="true"></td>
          </tr>
          <!-- 추가 행 가능 -->
        </tbody>
      </table>
    </div>
  </div>
  
  <hr>
  
  <!-- 과거 데이터 영역 (히스토리) -->
  <div id="pastDataContainer"></div>


  <script src="script.js"></script>
</body>
</html>
